name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets

  python-sdk:
    name: python sdk smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo build --release -p atlasctl
      - name: install sdk
        working-directory: clients/py
        run: pip install -e .
      - name: import + locate
        env:
          ATLASCTL: ${{ github.workspace }}/target/release/atlasctl
        run: |
          python -c "import atlas; print(atlas.__version__); print(atlas.locate_atlasctl())"

  fdb-integration:
    name: foundationdb backend (live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install FoundationDB client + server (7.3.27, matches fdb-7_3 feature)
        run: |
          ver=7.3.27
          base=https://github.com/apple/foundationdb/releases/download/$ver
          curl -sSL -o fdb-clients.deb $base/foundationdb-clients_${ver}-1_amd64.deb
          curl -sSL -o fdb-server.deb  $base/foundationdb-server_${ver}-1_amd64.deb
          sudo dpkg -i fdb-clients.deb fdb-server.deb
          # The server package auto-starts and configures a local single/memory
          # cluster; confirm it is available before testing.
          fdbcli --exec "status minimal"
      - name: run live FDB integration test
        run: cargo test -p atlas-meta-fdb --features fdb -- --nocapture

  rdma-transport:
    name: rdma transport (handshake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install libibverbs (FFI link target)
        run: sudo apt-get update && sudo apt-get install -y libibverbs-dev librdmacm-dev
      - name: build + run hardware-independent RDMA tests (QpParams handshake)
        # The verbs data path needs an InfiniBand/RoCE NIC (or a Soft-RoCE
        # rdma_rxe device, which requires kernel-module loading unavailable on
        # hosted runners) and is covered by a separate self-hosted lab job.
        run: cargo test -p atlas-transport --features rdma -- --nocapture

  gvfs-abi:
    name: gvfs C-ABI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build libatlas_gvfs.so
        run: cargo build -p atlas-gvfs
      - name: compile + run the C harness against the shared library
        # Proves the C-ABI entry points that libgvfsbackend-atlas.so links
        # against work when called from real C — no GNOME daemon required.
        run: |
          cc crates/atlas-gvfs/ctest/abi_smoke.c -L target/debug -latlas_gvfs -o abi_smoke
          LD_LIBRARY_PATH=target/debug ./abi_smoke

  pjdfstest:
    name: pjdfstest (placeholder)
    runs-on: ubuntu-latest
    steps:
      - run: echo "pjdfstest harness lands with FUSE adapter (T0.7)."
